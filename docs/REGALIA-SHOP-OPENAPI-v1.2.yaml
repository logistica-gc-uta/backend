components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    GeoPoint:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
      required:
      - lat
      - lng
      additionalProperties: false
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - ADMIN
          - CLIENT
          - DRIVER
      required:
      - id
      - name
      - email
      - role
      additionalProperties: false
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
      - name
      - email
      - password
      additionalProperties: false
    RegisterResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - CLIENT
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - email
      - role
      - createdAt
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
      additionalProperties: false
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
      required:
      - access_token
      - user
      additionalProperties: false
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type:
          - string
          - 'null'
        isActive:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - slug
      - description
      - isActive
      - sortOrder
      - createdAt
      - updatedAt
      additionalProperties: false
    CategoryPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type:
          - string
          - 'null'
        productCount:
          type: integer
          minimum: 0
        sortOrder:
          type: integer
          minimum: 0
      required:
      - id
      - name
      - slug
      - description
      - productCount
      - sortOrder
      additionalProperties: false
    ProductImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        secureUrl:
          type: string
          format: uri
        publicId:
          type: string
        altText:
          type: string
          maxLength: 160
        position:
          type: integer
          minimum: 0
          maximum: 5
        isPrimary:
          type: boolean
      required:
      - id
      - secureUrl
      - publicId
      - altText
      - position
      - isPrimary
      additionalProperties: false
    ProductShop:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/CategoryPublic'
        categoryId:
          type: string
          format: uuid
        priceCents:
          type: integer
          minimum: 1
        currency:
          type: string
          enum:
          - USD
        stock:
          type: integer
          minimum: 0
        isPublished:
          type: boolean
        isFeatured:
          type: boolean
        isAvailable:
          type: boolean
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        primaryImageUrl:
          type:
          - string
          - 'null'
          format: uri
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - sku
      - name
      - description
      - category
      - categoryId
      - priceCents
      - currency
      - stock
      - isPublished
      - isFeatured
      - isAvailable
      - images
      - primaryImageUrl
      - createdAt
      - updatedAt
      additionalProperties: false
    AdminProduct:
      type: object
      description: ADMIN-only representation; nullable fields identify unregularized legacy rows. Never expose as ProductShop.
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        categoryId: { type: [string, 'null'], format: uuid }
        category:
          oneOf:
          - $ref: '#/components/schemas/CategoryPublic'
          - type: 'null'
        priceCents: { type: [integer, 'null'], minimum: 1 }
        currency: { type: string, const: USD }
        stock: { type: integer, minimum: 0 }
        isPublished: { type: boolean }
        isFeatured: { type: boolean }
        isAvailable: { type: boolean }
        images:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/ProductImage'
        primaryImageUrl: { type: [string, 'null'], format: uri }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, sku, name, description, categoryId, category, priceCents, currency, stock, isPublished, isFeatured, isAvailable, images, primaryImageUrl, createdAt, updatedAt]
      additionalProperties: false
    AdminProductPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminProduct'
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 50, default: 10 }
        totalPages: { type: integer, minimum: 0 }
      required: [items, total, page, pageSize, totalPages]
      additionalProperties: false
    ProductPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductShop'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalPages:
          type: integer
          minimum: 0
        sortApplied:
          type: string
          enum:
          - featured
          - recent
          - price_asc
          - price_desc
          - best_selling
      required:
      - items
      - total
      - page
      - pageSize
      - totalPages
      - sortApplied
      additionalProperties: false
    CategoryPublicList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategoryPublic'
      required:
      - items
      additionalProperties: false
    CategoryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      required:
      - items
      additionalProperties: false
    AdminCreateProduct:
      type: object
      properties:
        sku:
          type: string
          minLength: 3
          maxLength: 50
        name: &id001
          type: string
          minLength: 3
          maxLength: 160
        description: &id002
          type: string
          minLength: 1
          maxLength: 2000
        categoryId: &id003
          type: string
          format: uuid
        priceCents: &id004
          type: integer
          minimum: 1
        stock: &id005
          type: integer
          minimum: 0
          maximum: 2147483647
        isFeatured: &id006
          type: boolean
          default: false
        isPublished: &id007
          type: boolean
          default: false
      required:
      - sku
      - name
      - description
      - categoryId
      - priceCents
      - stock
      additionalProperties: false
    AdminPatchProduct:
      type: object
      properties:
        name: *id001
        description: *id002
        categoryId: *id003
        priceCents: *id004
        stock: *id005
        isFeatured: *id006
        isPublished: *id007
      required: []
      additionalProperties: false
    AdminPublication:
      type: object
      properties:
        isPublished:
          type: boolean
      required:
      - isPublished
      additionalProperties: false
    AdminCreateCategory:
      type: object
      properties:
        name: &id008
          type: string
          minLength: 2
          maxLength: 80
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          minLength: 2
          maxLength: 100
        description: &id009
          type: [string, 'null']
          maxLength: 300
        isActive: &id010
          type: boolean
          default: true
        sortOrder: &id011
          type: integer
          minimum: 0
          maximum: 9999
      required:
      - name
      - slug
      additionalProperties: false
    AdminPatchCategory:
      type: object
      properties:
        name: *id008
        description: *id009
        isActive: *id010
        sortOrder: *id011
      required: []
      additionalProperties: false
    UploadedAsset:
      type: object
      properties:
        uploadId:
          type: string
          format: uuid
        secureUrl:
          type: string
          format: uri
        publicId:
          type: string
        format:
          type: string
          enum:
          - jpg
          - png
          - webp
        bytes:
          type: integer
          minimum: 1
          maximum: 5242880
        width:
          type: integer
          minimum: 1
          maximum: 8192
        height:
          type: integer
          minimum: 1
          maximum: 8192
        status:
          type: string
          enum:
          - UPLOADED
      required:
      - uploadId
      - secureUrl
      - publicId
      - format
      - bytes
      - width
      - height
      - status
      additionalProperties: false
    AttachImage:
      type: object
      properties:
        uploadId:
          type: string
          format: uuid
        altText:
          type: string
          minLength: 1
          maxLength: 160
        isPrimary:
          type: boolean
        position:
          type: integer
          minimum: 0
          maximum: 5
      required:
      - uploadId
      - altText
      - isPrimary
      - position
      additionalProperties: false
    PatchImage:
      type: object
      properties:
        altText:
          type: string
          minLength: 1
          maxLength: 160
        isPrimary:
          type: boolean
        position:
          type: integer
          minimum: 0
          maximum: 5
      required: []
      additionalProperties: false
    Recipient:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 7
          maxLength: 40
      required:
      - name
      - phone
      additionalProperties: false
    Delivery:
      type: object
      properties:
        recipient:
          $ref: '#/components/schemas/Recipient'
        zoneId:
          type: string
          format: uuid
        deliveryAddress:
          type: string
          minLength: 5
          maxLength: 250
        deliveryLocation:
          $ref: '#/components/schemas/GeoPoint'
        scheduledDeliveryDate:
          type: string
          format: date-time
          pattern: T.*(Z|[+-]\d{2}:\d{2})$
        deliveryNotes:
          type: string
          maxLength: 500
      required:
      - recipient
      - zoneId
      - deliveryAddress
      - deliveryLocation
      - scheduledDeliveryDate
      additionalProperties: false
    CheckoutItem:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 100
          description: Máximo dinámico settings.limits.maxUnitsPerSkuPerOrder (default 10); backend consolida
            líneas repetidas por SKU antes de validar.
      required:
      - productId
      - quantity
      additionalProperties: false
    QuoteRequest:
      type: object
      properties:
        items: &id012
          type: array
          items:
            $ref: '#/components/schemas/CheckoutItem'
          minItems: 1
          maxItems: 50
        delivery: &id013
          $ref: '#/components/schemas/Delivery'
      required:
      - items
      - delivery
      additionalProperties: false
    QuotedLine:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPriceCents:
          type: integer
          minimum: 1
        lineTotalCents:
          type: integer
          minimum: 1
        availableStock:
          type: integer
          minimum: 0
        available:
          type: boolean
      required:
      - productId
      - name
      - quantity
      - unitPriceCents
      - lineTotalCents
      - availableStock
      - available
      additionalProperties: false
    Shipping:
      type: object
      required:
      - status
      - amountCents
      - includedInPrices
      properties:
        status:
          type: string
          enum:
          - FREE_INCLUDED
        amountCents:
          type: integer
          const: 0
        includedInPrices:
          type: boolean
          const: true
      additionalProperties: false
      description: 'Gratis para CLIENT: costo logístico absorbido por precio de productos, no se suma
        cargo.'
    QuoteResponse:
      type: object
      properties:
        currency:
          type: string
          enum:
          - USD
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuotedLine'
        subtotalCents:
          type: integer
          minimum: 0
        totalCents:
          type: integer
          minimum: 0
          description: subtotalCents + tax.amountCents + shipping.amountCents, sumas exactas en centavos
        shipping:
          $ref: '#/components/schemas/Shipping'
        validUntil:
          type: string
          format: date-time
          description: Fin de vigencia de quoteToken, 15 minutos desde cotizar. No reserva inventario.
        quoteToken:
          type: string
          minLength: 10
          description: Token opaco firmado por backend, vinculado a líneas y precios, expira en 15 minutos.
        tax:
          $ref: '#/components/schemas/SimulatedTaxQuote'
        settingsVersion:
          type: integer
          minimum: 1
          description: Token vinculado a versión persistida de ShopSettings, cambios generan 409 SHOP_SETTINGS_CHANGED.
      required:
      - currency
      - items
      - subtotalCents
      - totalCents
      - shipping
