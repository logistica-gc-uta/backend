    envío GRATIS incluido en precios, IVA ficticio configurable (15% inicial), límite por SKU 10 inicial,
    horario Ecuador 07:00–17:00 inicial; Figma solo referencia opcional. Rutas nuevas propuestos NO implementadas
    en backend main; mantener contratos legacy. Requiere ratificación backend/frontend/QA.'
