name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma 8 usa la API global Temporal, disponible desde Node 26.
  NODE_VERSION: '26'

jobs:
  quality:
    name: Lint, build y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar pnpm
        run: npm install -g pnpm@12

      - name: Resolver store de pnpm
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cachear store de pnpm
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar sintaxis de scripts shell (bash -n)
        run: bash -n test/run-newman-isolated.sh test/run-e2e-isolated.sh

      - name: Validar scripts shell (shellcheck)
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck test/run-newman-isolated.sh test/run-e2e-isolated.sh

      - name: Lint (oxlint)
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Subir artefacto compilado para Newman
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: dist/
          retention-days: 1

      - name: Pruebas unitarias con cobertura mínima del 80 %
        run: >
          pnpm run test:cov
          --coverageThreshold='{"global":{"statements":80,"branches":80,"functions":80,"lines":80}}'

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          if-no-files-found: ignore

  e2e-tests:
    name: Pruebas E2E aisladas (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar pnpm
        run: npm install -g pnpm@12

      - name: Resolver store de pnpm
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cachear store de pnpm
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Preparar imagen PostgreSQL para runners propietarios
        run: docker pull postgres:16-alpine

      - name: Ejecutar shard E2E aislado (PostgreSQL propio)
        run: env -u DATABASE_URL -u JWT_SECRET DOTENV_CONFIG_PATH=/dev/null E2E_SHARD="${{ matrix.shard }}/4" pnpm run test:e2e:isolated

  api-newman:
    name: Pruebas de API (Newman aislado)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar pnpm
        run: npm install -g pnpm@12

      - name: Resolver store de pnpm
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cachear store de pnpm
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Descargar build compilado desde quality
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: dist/

      - name: Preparar imagen PostgreSQL para Newman
        run: docker pull postgres:16-alpine

      - name: Ejecutar colección Newman (aislado)
        run: env -u DATABASE_URL DOTENV_CONFIG_PATH=/dev/null pnpm run test:api:report

      - name: Subir reporte HTML de Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-newman
          path: reports/newman/
          if-no-files-found: ignore
