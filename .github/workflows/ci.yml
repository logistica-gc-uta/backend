name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma 8 usa la API global Temporal, disponible desde Node 26.
  NODE_VERSION: '26'

jobs:
  quality:
    name: Lint, build y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar pnpm
        run: npm install -g pnpm@12

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar sintaxis de scripts shell (bash -n)
        run: bash -n test/run-newman-isolated.sh

      - name: Validar scripts shell (shellcheck)
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck test/run-newman-isolated.sh

      - name: Lint (oxlint)
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Pruebas unitarias con cobertura mínima del 80 %
        run: >
          pnpm run test:cov
          --coverageThreshold='{"global":{"statements":80,"branches":80,"functions":80,"lines":80}}'

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          if-no-files-found: ignore

  api-tests:
    name: Pruebas de integración E2E y API (PostgreSQL y Newman)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logistica_user
          POSTGRES_PASSWORD: logistica_password123
          POSTGRES_DB: issue6_ci_${{ github.run_id }}_${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logistica_user -d issue6_ci_${{ github.run_id }}_${{ github.run_attempt }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://logistica_user:logistica_password123@127.0.0.1:5432/issue6_ci_${{ github.run_id }}_${{ github.run_attempt }}?schema=public
      # Solo para el entorno efímero de CI; no es un secreto real.
      JWT_SECRET: ci_only_jwt_secret
      JWT_EXPIRES_IN: 1d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar pnpm
        run: npm install -g pnpm@12

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Inicializar esquema en base de datos temporal
        run: pnpm prisma db init

      - name: Ejecutar pruebas E2E (PostgreSQL)
        run: pnpm run test:e2e --runInBand

      - name: Compilar backend para pruebas de API
        run: pnpm run build

      - name: Ejecutar colección Newman (aislado)
        run: env -u DATABASE_URL pnpm run test:api:report

      - name: Subir reporte HTML de Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-newman
          path: reports/newman/
          if-no-files-found: ignore
